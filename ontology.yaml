# ═══════════════════════════════════════════════════════════
# Онтология проекта: синтез Co3O4 и микроплоттерная печать
# Источник: simonenko_et_al_2022_co3o4.pdf (ЖНХ, 2022, с. 1728–1736)
# Создана: 2026-10-22, сессия 2 (финализация)
# Обновлена: 2026-10-23, сессия AI4Science (удаление дубликатов)
# ═══════════════════════════════════════════════════════════

ontology:
  id: co3o4-microplotter
  title: "Онтология проекта синтеза Co3O4 и микроплоттерной печати"
  version: "0.3"
  date: "2026-10-22"
  source: "library/simonenko_et_al_2022_co3o4.pdf"

# ────────────────────────────────────────────────────────────
# 1. Классы — иерархия с parent-ссылками
# ────────────────────────────────────────────────────────────
classes:

  ПроектнаяСущность:
    definition: "Корневой класс всех сущностей проекта: научных объектов
                 и проектных артефактов."
    parent: null
    examples: []

  НаучнаяСущность:
    definition: "Класс объектов, относящихся к научному содержанию:
                 материалы, методы, параметры."
    parent: ПроектнаяСущность
    examples: []

  Материал:
    definition: "Химическое вещество или материал, фигурирующий в синтезе,
                 характеризации или печати."
    parent: НаучнаяСущность
    examples: []

  Метод:
    definition: "Экспериментальный или аналитический метод, применённый
                 в статье для синтеза, характеризации или печати."
    parent: НаучнаяСущность
    examples: []

  Параметр:
    definition: "Измеряемая или задаваемая величина эксперимента:
                 температура, скорость, концентрация, размер и т.п."
    parent: НаучнаяСущность
    examples: []

  Феномен:
    definition: "Наблюдаемое физико-химическое явление, описанное в статье."
    parent: НаучнаяСущность
    examples: []

  АртефактПроекта:
    definition: "Класс проектных артефактов: файлы, задачи, документы."
    parent: ПроектнаяСущность
    examples: []

  Файл:
    definition: "Цифровой ресурс проекта: исходные данные, результаты,
                 документация, статья-источник."
    parent: АртефактПроекта
    examples: []

  Задача:
    definition: "Научная или инженерная задача, решаемая в рамках проекта;
                 может быть сформулирована как компетентностный вопрос."
    parent: АртефактПроекта
    examples: []

  ВыполненнаяЗадача:
    definition: "Задача, статус которой равен 'выполнена' или 'принята'."
    parent: Задача
    examples: []

# ────────────────────────────────────────────────────────────
# 2. Отношения (domain/range — только объявленные классы)
# ────────────────────────────────────────────────────────────
relations:

  использует_метод:
    domain: Задача
    range: Метод
    definition: "Задача решается с помощью указанного метода."

  синтезирует:
    domain: Метод
    range: Материал
    definition: "Метод применяется для получения указанного материала."

  характеризует:
    domain: Метод
    range: Материал
    definition: "Метод используется для характеризации материала."

  имеет_параметр:
    domain: Метод
    range: Параметр
    definition: "Метод выполняется при заданном значении параметра."

  хранится_в:
    domain: Файл
    range: Файл
    definition: "Один файл ссылается на другой (например, L2.md ссылается на L1.md)."

  описывает:
    domain: Файл
    range: Материал
    definition: "Файл содержит сведения о данном материале."

  решает:
    domain: Задача
    range: Задача
    definition: "Решение одной задачи является подзадачей другой."

  имеет_итог:
    domain: Задача
    range: Файл
    definition: "Задача связана с файлом, содержащим её результат."

  имеет_свойство:
    domain: Материал
    range: Феномен
    definition: "Материал обладает или не обладает данным свойством/явлением."

  использует_реагент:
    domain: Метод
    range: Материал
    definition: "Метод синтеза использует указанный реагент."

  использует_чернила:
    domain: Метод
    range: Материал
    definition: "Метод печати использует указанные функциональные чернила."

  содержит:
    domain: Материал
    range: Материал
    definition: "Материал или смесь содержит указанный компонент."

  формирует:
    domain: Метод
    range: Материал
    definition: "Метод формирует указанную структуру или материал."

# ────────────────────────────────────────────────────────────
# 3. Атрибуты
# ────────────────────────────────────────────────────────────
attributes:

  status:
    type: enum
    values: [открыта, "в работе", выполнена, принята, заблокирована]
    definition: "Статус задачи в проекте."
    default: открыта

  страница:
    type: integer
    definition: "Номер страницы журнальной версии статьи (1728–1736)."

  pdf_страница:
    type: integer
    definition: "Номер страницы в PDF-файле (на 1 меньше журнальной)."

  единица:
    type: string
    definition: "Единица измерения параметра."

  значение:
    type: string
    definition: "Числовое или строковое значение параметра."

  outcome:
    type: string
    definition: "Итог завершённой задачи или принятого артефакта."

  outcome_file:
    type: string
    definition: "Путь к файлу, являющемуся результатом задачи."

# ────────────────────────────────────────────────────────────
# 4. Компетентностные вопросы (3–5)
# ────────────────────────────────────────────────────────────
competency_questions:
  - "Какой метод синтеза обеспечивает получение нанодисперсного Co3O4 без кристаллических примесей?"
  - "Какие параметры микроплоттерной печати определяют отсутствие эффекта «кофейного пятна»?"
  - "Как соотносятся размеры области когерентного рассеяния (РФА) и первичных частиц (ПЭМ)?"
  - "Какие характеристики планарных структур Co3O4 получены методами КЗСМ и СЕМ?"

# ────────────────────────────────────────────────────────────
# 5. Понятия темы (экземпляры с instance_of)
#    Каждый экземпляр ссылается на определённый класс.
# ────────────────────────────────────────────────────────────
concepts:

  Co3O4:
    kind: instance
    definition: "Оксид кобальта(II,III), шпинельная структура (Fd-3m),
                 p-полупроводник с шириной запрещённой зоны 1.6–2.2 эВ.
                 Нанодисперсный порошок, полученный методом химического
                 осаждения; размер ОКР 17±2 нм (РФА), размер частиц
                 23±2 нм (ПЭМ)."
    source_pages: [1728, 1731, 1732]
    instance_of: Материал

  нитрат_кобальта:
    kind: instance
    definition: "Исходный прекурсор для синтеза Co3O4; водный раствор
                 концентрации 0.05 моль/л."
    source_page: 1729
    instance_of: Материал

  гидрат_аммиака:
    kind: instance
    definition: "Осаждающий агент; 5%-ный раствор, добавляемый до pH 9.2."
    source_page: 1729
    instance_of: Материал

  этиленгликоль:
    kind: instance
    definition: "Растворитель-диспергатор для приготовления функциональных
                 чернил; масса порошка к растворителю 0.015 г / 1.585 г."
    source_page: 1729
    instance_of: Материал

  химическое_осаждение:
    kind: instance
    definition: "Метод синтеза, при котором осадок образуется из раствора
                 при смешивании реагентов; выбран как масштабируемый и
                 контролируемый. Использован для получения Co3O4."
    source_pages: [1729, 1730]
    instance_of: Метод

  микроплоттерная_печать:
    kind: instance
    definition: "Аддитивный метод печати через стеклянный капилляр с
                 касанием мениска; позволяет формировать планарные
                 наноструктуры с разрешением 100–300 мкм."
    source_pages: [1729, 1730, 1733]
    instance_of: Метод

  рентгенофазовый_анализ:
    kind: instance
    definition: "Метод фазового анализа порошков; подтвердил чистоту
                 шпинели Co3O4 (Fd-3m) без примесей."
    source_page: 1731
    instance_of: Метод

  просвечивающая_электронная_микроскопия:
    kind: instance
    definition: "Метод характеризации; измерен размер первичных частиц
                 Co3O4 23±2 нм."
    source_page: 1732
    instance_of: Метод

  эффект_кофейного_пятна:
    kind: instance
    definition: "Феномен скопления частиц по краям испаряющейся капли;
                 в данной работе отсутствует благодаря оптимизации чернил."
    source_page: 1733
    instance_of: Феномен

  планарная_структура:
    kind: instance
    definition: "Наноструктурированная плёнка Co3O4, сформированная
                 микроплоттерной печатью; потенциальный электрод
                 планарного суперконденсатора."
    source_pages: [1733, 1734, 1735]
    instance_of: Материал

  функциональные_чернила:
    kind: instance
    definition: "Суспензия порошка Co3O4 в этиленгликоле, приготовленная
                 для микроплоттерной печати."
    source_pages: [1729, 1732]
    instance_of: Материал

  статья_источник:
    kind: instance
    definition: "PDF статьи Симоненко и соавторов (2022), используемый как первичный источник проекта."
    path: "library/simonenko_et_al_2022_co3o4.pdf"
    instance_of: Файл

  схема_онтологии:
    kind: instance
    definition: "YAML-файл с классами, отношениями, атрибутами и правилами онтологии проекта."
    path: "ontology.yaml"
    instance_of: Файл

  проверка_недели_4:
    kind: instance
    definition: "Скрипт для проверки иерархии, типов связей, заметок и статусов задач графа."
    path: "check_week4.py"
    instance_of: Файл

# ────────────────────────────────────────────────────────────
# 6. Проверяемые правила (≥ 2)
# ────────────────────────────────────────────────────────────
rules:

  правило_1:
    id: R1
    name: "Статус должен быть допустимым"
    description: "Атрибут status задачи принимает только значения,
                  перечисленные в enum status."
    check: "status IN ('открыта', 'в работе', 'выполнена', 'принята', 'заблокирована')"

  правило_2:
    id: R2
    name: "Страница статьи должна быть в диапазоне"
    description: "Атрибут страница (журнальная) должен быть в диапазоне
                  1728–1736; pdf_страница — в диапазоне 1–9."
    check: "1728 <= страница <= 1736 AND 1 <= pdf_страница <= 9"

  правило_3:
    id: R3
    name: "Связь domain/range должна быть согласована с классами"
    description: "Для каждого отношения domain и range должны соответствовать
                  определённому классу из секции classes."
    check: "domain IN classes AND range IN classes"

  правило_4:
    id: R4
    name: "ВыполненнаяЗадача из статуса"
    description: "Задача со статусом 'выполнена' или 'принята' относится к
                  классу ВыполненнаяЗадача. У таких задач обязательно наличие
                  атрибута outcome и связи outcome_file."
    check: "IF status IN ('выполнена', 'принята') THEN outcome IS NOT NULL AND outcome_file IS NOT NULL"

  правило_5:
    id: R5
    name: "Невыполненная подзадача блокирует родителя"
    description: "Если хотя бы одна подзадача (связь решает → текущая задача)
                  имеет статус 'открыта', 'в работе' или 'заблокирована',
                  то родительская задача не может иметь статус 'выполнена'
                  или 'принята'."
    check: "IF EXISTS child WHERE child.status IN ('открыта', 'в работе', 'заблокирована') THEN parent.status NOT IN ('выполнена', 'принята')"

