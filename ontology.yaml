# ═══════════════════════════════════════════════════════════
# Онтология проекта: синтез Co3O4 и микроплоттерная печать
# Источник: simonenko_et_al_2022_co3o4.pdf (ЖНХ, 2022, с. 1728–1736)
# Создана: 2026-10-22, сессия 2 (финализация)
# ═══════════════════════════════════════════════════════════

ontology:
  id: co3o4-microplotter
  title: "Онтология проекта синтеза Co3O4 и микроплоттерной печати"
  version: "0.2"
  date: "2026-10-22"
  source: "library/simonenko_et_al_2022_co3o4.pdf"

# ────────────────────────────────────────────────────────────
# 1. Классы — иерархия с parent-ссылками
# ────────────────────────────────────────────────────────────
classes:

  ПроектнаяСущность:
    definition: "Корневой класс всех сущностей проекта: научных объектов
                 и проектных артефактов."
    parent: null
    examples: []

  НаучнаяСущность:
    definition: "Класс объектов, относящихся к научному содержанию:
                 материалы, методы, параметры."
    parent: ПроектнаяСущность
    examples: []

  Материал:
    definition: "Химическое вещество или материал, фигурирующий в синтезе,
                 характеризации или печати."
    parent: НаучнаяСущность
    examples:
      - "Co3O4"
      - "нитрат кобальта"
      - "этиленгликоль"

  Метод:
    definition: "Экспериментальный или аналитический метод, применённый
                 в статье для синтеза, характеризации или печати."
    parent: НаучнаяСущность
    examples:
      - "химическое осаждение"
      - "рентгенофазовый анализ"
      - "микроплоттерная печать"

  Параметр:
    definition: "Измеряемая или задаваемая величина эксперимента:
                 температура, скорость, концентрация, размер и т.п."
    parent: НаучнаяСущность
    examples:
      - "температура прокаливания: 400 °C"
      - "скорость осаждения: 1 мл/мин"

  АртефактПроекта:
    definition: "Класс проектных артефактов: файлы, задачи, документы."
    parent: ПроектнаяСущность
    examples: []

  Файл:
    definition: "Цифровой ресурс проекта: исходные данные, результаты,
                 документация, статья-источник."
    parent: АртефактПроекта
    examples:
      - "data/measurements.csv"
      - "memory/L1.md"
      - "library/simonenko_et_al_2022_co3o4.pdf"

  Задача:
    definition: "Научная или инженерная задача, решаемая в рамках проекта;
                 может быть сформулирована как компетентностный вопрос."
    parent: АртефактПроекта
    examples:
      - "Синтезировать нанодисперсный Co3O4 методом химического осаждения"
      - "Оптимизировать параметры микроплоттерной печати для отсутствия эффекта «кофейного пятна»"

# ────────────────────────────────────────────────────────────
# 2. Отношения (domain/range — только объявленные классы)
# ────────────────────────────────────────────────────────────
relations:

  использует_метод:
    domain: Задача
    range: Метод
    definition: "Задача решается с помощью указанного метода."

  синтезирует:
    domain: Метод
    range: Материал
    definition: "Метод применяется для получения указанного материала."

  характеризует:
    domain: Метод
    range: Материал
    definition: "Метод используется для характеризации материала."

  имеет_параметр:
    domain: Метод
    range: Параметр
    definition: "Метод выполняется при заданном значении параметра."

  хранится_в:
    domain: Файл
    range: Файл
    definition: "Один файл ссылается на другой (например, L2.md ссылается на L1.md)."

  описывает:
    domain: Файл
    range: Материал
    definition: "Файл содержит сведения о данном материале."

  решает:
    domain: Задача
    range: Задача
    definition: "Решение одной задачи является подзадачей другой."

# ────────────────────────────────────────────────────────────
# 3. Атрибуты
# ────────────────────────────────────────────────────────────
attributes:

  status:
    type: enum
    values: [черновик, проверен, устарел]
    definition: "Статус утверждения или записи в онтологии."
    default: черновик

  страница:
    type: integer
    definition: "Номер страницы журнальной версии статьи (1728–1736)."

  pdf_страница:
    type: integer
    definition: "Номер страницы в PDF-файле (на 1 меньше журнальной)."

  единица:
    type: string
    definition: "Единица измерения параметра."

  значение:
    type: string
    definition: "Числовое или строковое значение параметра."

# ────────────────────────────────────────────────────────────
# 4. Компетентностные вопросы (3–5)
# ────────────────────────────────────────────────────────────
competency_questions:
  - "Какой метод синтеза обеспечивает получение нанодисперсного Co3O4 без кристаллических примесей?"
  - "Какие параметры микроплоттерной печати определяют отсутствие эффекта «кофейного пятна»?"
  - "Как соотносятся размеры области когерентного рассеяния (РФА) и первичных частиц (ПЭМ)?"
  - "Какие характеристики планарных структур Co3O4 получены методами КЗСМ и СЕМ?"

# ────────────────────────────────────────────────────────────
# 5. Понятия темы (5–7, каждое — class или instance)
#    instance_of указывает родительский класс для экземпляров
# ────────────────────────────────────────────────────────────
concepts:

  Co3O4:
    kind: class
    definition: "Оксид кобальта(II,III), шпинельная структура (Fd-3m),
                 p-полупроводник с шириной запрещённой зоны 1.6–2.2 эВ."
    source_page: 1728
    instance_of: null

  химическое_осаждение:
    kind: class
    definition: "Метод синтеза, при котором осадок образуется из раствора
                 при смешивании реагентов; выбран как масштабируемый и
                 контролируемый."
    source_page: 1729
    instance_of: null

  микроплоттерная_печать:
    kind: class
    definition: "Аддитивный метод печати через стеклянный капилляр с
                 касанием мениска; позволяет формировать планарные
                 наноструктуры с разрешением 100–300 мкм."
    source_page: 1729
    instance_of: null

  эффект_кофейного_пятна:
    kind: instance
    definition: "Феномен скопления частиц по краям испаряющейся капли;
                 в данной работе отсутствует благодаря оптимизации чернил."
    source_page: 1728
    instance_of: Метод

  нитрат_кобальта:
    kind: instance
    definition: "Исходный прекурсор для синтеза Co3O4; водный раствор
                 концентрации 0.05 моль/л."
    source_page: 1729
    instance_of: Материал

  гидрат_аммиака:
    kind: instance
    definition: "Осаждающий агент; 5%-ный раствор, добавляемый до pH 9.2."
    source_page: 1729
    instance_of: Материал

  этиленгликоль:
    kind: instance
    definition: "Растворитель-диспергатор для приготовления функциональных
                 чернил; масса порошка к растворителю 0.015 г / 1.585 г."
    source_page: 1729
    instance_of: Материал

# ────────────────────────────────────────────────────────────
# 6. Проверяемые правила (≥ 2)
# ────────────────────────────────────────────────────────────
rules:

  правило_1:
    id: R1
    name: "Статус должен быть допустимым"
    description: "У каждого утверждения атрибут status может принимать
                  только значения из перечня [черновик, проверен, устарел]."
    check: "status IN ('черновик', 'проверен', 'устарел')"

  правило_2:
    id: R2
    name: "Страница статьи должна быть в диапазоне"
    description: "Атрибут страница (журнальная) должен быть в диапазоне
                  1728–1736; pdf_страница — в диапазоне 1–8."
    check: "1728 <= страница <= 1736 AND 1 <= pdf_страница <= 8"

  правило_3:
    id: R3
    name: "Связь domain/range должна быть согласована с классами"
    description: "Для каждого отношения domain и range должны соответствовать
                  определённому классу из секции classes."
    check: "domain IN classes AND range IN classes"

# ────────────────────────────────────────────────────────────
# 7. Внутренние ссылки на файлы проекта
# ────────────────────────────────────────────────────────────
links:
  article: "library/simonenko_et_al_2022_co3o4.pdf"
  l1: "memory/L1.md"
  l2: "memory/L2.md"
  l3: "memory/L3.md"
  index: "INDEX.md"
  notes: "ontology/notes/"